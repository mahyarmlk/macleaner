name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Unit tests on the Python that ships with macOS
        run: /usr/bin/python3 -m unittest discover -s tests
      - name: Smoke test on a real Mac (read-only)
        run: |
          python macleaner.py --version
          python macleaner.py status
          python macleaner.py scan --keys
          python macleaner.py scan --json > scan.json
          python -c "import json; json.load(open('scan.json'))"
          python macleaner.py clean --safe --dry-run
      - name: Package installs
        run: |
          python -m pip install .
          macleaner --version
