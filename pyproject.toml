[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "macleaner"
dynamic = ["version"]
description = "Find what's eating your Mac's disk (dev caches, build folders, emulators, Docker) and reclaim it safely."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mahyarmlk" }]
keywords = ["macos", "disk-space", "cleaner", "cache", "developer-tools", "cli"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Filesystems",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/mahyarmlk/macleaner"
Issues = "https://github.com/mahyarmlk/macleaner/issues"
Changelog = "https://github.com/mahyarmlk/macleaner/blob/main/CHANGELOG.md"

[project.scripts]
macleaner = "macleaner:main"

[tool.setuptools]
py-modules = ["macleaner"]

[tool.setuptools.dynamic]
version = { attr = "macleaner.__version__" }

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
ignore = ["SIM105", "SIM108", "B023", "UP007", "UP045"]
